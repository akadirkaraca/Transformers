[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transformer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.13",
    "transformers>=4.30",
    "pandas>=1.5",
    "nltk>=3.8",
    "rouge-score>=0.1.2",
    "PyYAML>=6.0",
    "tqdm>=4.65",
    "numpy>=1.24",
    "tensorboard>=2.13",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["transformer"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
