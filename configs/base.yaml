model:
  d_model: 512
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  d_ff: 2048
  dropout: 0.2
  max_seq_len: 768
  weight_tying: true
  encoder_activation: gelu   # encoder FFN: "relu" | "gelu" | "silu"
  decoder_activation: silu   # decoder FFN: "relu" | "gelu" | "silu"
  architecture: encoder_decoder  # "encoder_decoder" | "encoder_only" | "decoder_only"
  attn_impl: sdpa            # attention backend: "manual" | "sdpa"

tokenizer:
  vocab_size: 32000
  model_type: bpe
  character_coverage: 0.9995
  pad_id: 0
  unk_id: 1
  bos_id: 2
  eos_id: 3
  model_path: tokenizer/bpe32k.model

training:
  epochs: 25
  batch_size: 32
  learning_rate: 1.5e-4
  warmup_steps: 2000
  optimizer: adamw        # "adam" | "adamw"
  weight_decay: 0.05  # uncomment with adamw
  label_smoothing: 0.15
  gradient_clip: 1.0
  gradient_accumulation_steps: 16
  amp: true
  torch_compile: "eager"   # "eager" | "graph"
  save_top_k: 3
  checkpoint_dir: checkpoints
  log_every: 100
  eval_every: 1
  seed: 42
  early_stopping_patience: 3
  early_stopping_min_delta: 0.001
  mlm_probability: 0.15       # fraction of tokens masked (encoder_only only)
  mask_id: 1                  # token id for [MASK]; defaults to unk_id (no dedicated mask token)

data:
  data_path: data/mlsum_tr.jsonl
  data_format: jsonl          # "csv" | "jsonl" | "text"
  input_col: input          # column/field for input text
  output_col: output        # column/field for output text; "" = single-column mode
  preprocessing: basic       # "none" | "basic" (NFC + URL/email removal + whitespace normalization)
  train_ratio: 0.85
  val_ratio: 0.10
  test_ratio: 0.05
  max_input_len: 768        # max input sequence length (tokens)
  max_output_len: 84       # max output sequence length (tokens)
  num_workers: 2

inference:
  beam_size: 4
  length_penalty: 0.6
  max_decode_len: 84
  min_decode_len: 3
  torch_compile: "eager"   # "eager" | "graph"

checkpoint:
  formats: [ckpt, safetensors]
  # Formats saved at each checkpoint during training:
  #   ckpt         → full training state (model + optimizer + scheduler + metadata), resumable
  #   safetensors  → model weights only (no pickle, memory-mapped, for inference/sharing)
  #   pt           → legacy PyTorch format (same content as ckpt, kept for compatibility)